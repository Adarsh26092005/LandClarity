services:
  # PostgreSQL 16 with PostGIS 3.4 for spatial cadastral data & relational models
  postgres:
    image: postgis/postgis:16-3.4
    container_name: landclarity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-landclarity_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-landclarity_secure_pass}
      POSTGRES_DB: ${DB_NAME:-landclarity_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-landclarity_user} -d ${DB_NAME:-landclarity_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 for BullMQ queues (async OCR, audit processing) and caching
  redis:
    image: redis:7-alpine
    container_name: landclarity-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for S3-compatible, tamper-evident private document storage
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: landclarity-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-landclarity_minio_admin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-landclarity_minio_secret_password}
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
